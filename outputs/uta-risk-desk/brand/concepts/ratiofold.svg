<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ratiofold identity territory</title>
  <desc id="desc">Editorial comparison identity using two registered panels folded into one before and after object.</desc>
  <rect width="1600" height="1000" fill="#F5EEE5"/>
  <rect x="48" y="48" width="1504" height="904" rx="8" fill="#2B1826"/>
  <text x="96" y="125" fill="#E8B4A2" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4">TERRITORY B / COMPARISON OBJECT</text>
  <g transform="translate(100 200)">
    <path d="M0 0H210L270 60L210 120H0Z" fill="#E8B4A2"/>
    <path d="M270 60L330 0H540V120H330Z" fill="#4962D4"/>
    <path d="M270 -18V138" stroke="#F5EEE5" stroke-width="8" stroke-dasharray="12 12"/>
    <circle cx="270" cy="60" r="15" fill="#2B1826" stroke="#F5EEE5" stroke-width="6"/>
  </g>
  <text x="96" y="545" fill="#F5EEE5" font-family="Georgia, Times New Roman, serif" font-weight="700" font-size="126" letter-spacing="-6">Ratiofold</text>
  <text x="102" y="620" fill="#E8B4A2" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="31">BEFORE AND AFTER, ON THE SAME TERMS.</text>
  <line x1="102" y1="680" x2="1498" y2="680" stroke="#624655" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="102" y="735" fill="#BDA6B4" font-size="19" letter-spacing="3">PRODUCT DESCRIPTOR</text>
    <text x="102" y="780" fill="#F5EEE5" font-size="28">Before/after margin impact for Bitget UTA.</text>
    <text x="102" y="850" fill="#BDA6B4" font-size="19" letter-spacing="3">PALETTE</text>
    <rect x="102" y="875" width="170" height="34" fill="#F5EEE5"/><rect x="286" y="875" width="170" height="34" fill="#E8B4A2"/><rect x="470" y="875" width="170" height="34" fill="#4962D4"/><rect x="654" y="875" width="170" height="34" fill="#2B1826" stroke="#624655"/>
    <text x="1120" y="894" fill="#BDA6B4" font-size="18">current / fold / projected</text>
